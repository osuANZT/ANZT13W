<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="../_shared/css/gameplay-mappool.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=SUSE:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Axios-->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
</head>
<body>
    <div class="main">
        <!-- Top Middle Part -->
        <img class="logo" src="static/logo.png">
        <div class="round-name" id="round-name">ROUND OF 64</div>

        <!-- Team Red -->
        <div class="team-background team-red-background"></div>
        <div class="team-name team-red-name" id="team-red-name">team RRRRRRRRRRRR</div>
        <div class="team-pfp team-red-pfp" id="team-red-pfp">
            <img class="team-pfp-glass" src="../_shared/assets/avatar-glass.png">
        </div>
        <div class="team-point-container team-red-point-container" id="red-team-star-container"></div>

        <!-- Team Blue -->
        <div class="team-background team-blue-background"></div>
        <div class="team-name team-blue-name" id="team-blue-name">team B</div>
        <div class="team-pfp team-blue-pfp" id="team-blue-pfp">
            <img class="team-pfp-glass" src="../_shared/assets/avatar-glass.png">
        </div>
        <div class="team-point-container team-blue-point-container" id="blue-team-star-container"></div>

        <!-- Accuracy Difference -->
        <div class="accuracy-difference" id="accuracy-difference">+-2.07%</div>

        <!-- Score Bars -->
        <div class="score-bar score-bar-left"></div>
        <div class="score-bar score-bar-right"></div>

        <!-- Score Difference -->
        <div class="score-text score-difference score-difference-left">-197,802</div>
        <div class="score-text score-difference score-difference-right">-197,802</div>

        <!-- Playing Score -->
        <div class="score-text score score-left">123,321</div>
        <div class="score-text score score-right score-leading">321,123</div>

        <!-- Crown -->
        <img class="crown" id="crown-left" src="static/crown/crown-red-lead.png">
        <img class="crown" id="crown-right" src="static/crown/crown-blue-lead.png">

        <!-- Now Playing -->
        <div class="now-playing-panel">
            <div class="now-playing-background"></div>
            <img class="now-playing-overlay" src="static/overlay.png">
            <img class="now-playing-mod-id" src="../_shared/assets/mods/hd1.png">
            <div class="now-playing-details">
                <div class="now-playing-stats">
                    <div class="now-playing-stats-wrapper">
                        <div class="now-playing-stats-text now-playing-details-grey-nonbold">cs</div>
                        <div class="now-playing-stats-number now-playing-details-white-bold">4.0</div>
                    </div>
                    <div class="now-playing-stats-wrapper">
                        <div class="now-playing-stats-text now-playing-details-grey-nonbold">ar</div>
                        <div class="now-playing-stats-number now-playing-details-white-bold">9.2</div>
                    </div>
                    <div class="now-playing-stats-wrapper">
                        <div class="now-playing-stats-text now-playing-details-grey-nonbold">od</div>
                        <div class="now-playing-stats-number now-playing-details-white-bold">9.0</div>
                    </div>
                    <div class="now-playing-stats-wrapper">
                        <div class="now-playing-stats-text now-playing-details-grey-nonbold">sr</div>
                        <div class="now-playing-stats-number now-playing-details-white-bold">6.49*</div>
                    </div>
                </div>
                <div class="now-playing-metadata">
                    <div class="now-playing-artist now-playing-details-white-bold">Kinoko Teikoku</div>
                    <div class="now-playing-title now-playing-details-grey-nonbold">Kokudou Slope</div>
                    <div class="now-playing-difficulty now-playing-details-white-bold">[January]</div>
                </div>
                <div class="now-playing-mapper">
                    <div class="now-playing-mapper-text now-playing-details-grey-nonbold">mapped by</div>
                    <div class="now-playing-mapper-name now-playing-details-white-bold">moph</div>
                </div>
            </div>
            <img class="np-pick" src="static/np-pick/np-red-pick.png">
        </div>

        <!-- History Panel -->
        <div class="history-panel history-panel-left">
            <div class="history-panel-card">

            </div>
        </div>
        <div class="history-panel history-panel-right">
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
            <div class="history-panel-card">
                <img class="history-panel-mod-id" src="../_shared/assets/mods/dt1.png">
                <img class="history-panel-win" src="static/history-pick/history-blue-pick.png">
            </div>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
