<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="../_shared/css/gameplay-mappool.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&family=SUSE:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main">
        <!-- Top Middle Part -->
        <img class="logo" src="static/logo.png">
        <div class="round-name">ROUND OF 64</div>

        <!-- Team Red -->
        <div class="team-background team-red-background"></div>
        <div class="team-name team-red-name" id="team-red-name">team RRRRRRRRRRRR</div>
        <div class="team-pfp team-red-pfp">
            <img class="team-pfp-glass" src="../_shared/assets/avatar-glass.png">
        </div>
        <div class="team-point-container team-red-point-container" id="red-team-star-container"></div>

        <!-- Team Blue -->
        <div class="team-background team-blue-background"></div>
        <div class="team-name team-blue-name" id="team-blue-name">team B</div>
        <div class="team-pfp team-blue-pfp">
            <img class="team-pfp-glass" src="../_shared/assets/avatar-glass.png">
        </div>
        <div class="team-point-container team-blue-point-container" id="blue-team-star-container"></div>

        <!-- Accuracy Difference -->
        <div class="accuracy-difference" id="accuracy-difference">+-2.07%</div>
    </div>
</body>
</html>
