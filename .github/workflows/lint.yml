name: Lint and Fix

on:
    pull_request:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install linters globally
              run: |
                  npm install --global eslint htmlhint stylelint stylelint-config-standard

            - name: Auto-fix CSS
              id: css_fix
              continue-on-error: true
              run: |
                  stylelint "**/*.css" --fix

            - name: Auto-fix JavaScript
              id: js_fix
              continue-on-error: true
              run: |
                  eslint "**/*.js" --ignore-pattern eslint.config.js --fix

            - name: Lint HTML
              id: html_lint
              continue-on-error: true
              run: |
                  htmlhint "**/*.html"

            - name: Report lint results
              if: always()
              run: |
                  echo "Lint results:"
                  echo "  CSS:  ${{ steps.css_fix.outcome }}"
                  echo "  JS:   ${{ steps.js_fix.outcome }}"
                  echo "  HTML: ${{ steps.html_lint.outcome }}"

                  failed=0

                  if [ "${{ steps.css_fix.outcome }}" = "failure" ]; then
                      echo "CSS lint/fix failed"
                      failed=1
                  fi

                  if [ "${{ steps.js_fix.outcome }}" = "failure" ]; then
                      echo "JavaScript lint/fix failed"
                      failed=1
                  fi

                  if [ "${{ steps.html_lint.outcome }}" = "failure" ]; then
                      echo "HTML lint failed"
                      failed=1
                  fi

                  if [ "$failed" -ne 0 ]; then
                      echo "One or more lint checks failed, but continuing to PR creation."
                  fi

            - name: Create Pull Request for lint fixes
              uses: peter-evans/create-pull-request@v6
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  commit-message: "lint: auto-fix style issues"
                  title: "Automated lint fixes"
                  body: |
                      This PR was automatically created by GitHub Actions.

                      Lint results:
                      - CSS: ${{ steps.css_fix.outcome }}
                      - JS: ${{ steps.js_fix.outcome }}
                      - HTML: ${{ steps.html_lint.outcome }}
                  branch: lint-fixes/${{ github.head_ref }}
                  base: ${{ github.base_ref }}
                  delete-branch: true