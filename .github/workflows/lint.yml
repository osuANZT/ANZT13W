name: Lint and Fix

on:
    pull_request:
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install linters globally
              run: |
                  npm install --global eslint htmlhint stylelint stylelint-config-standard

            - name: Auto-fix CSS
              id: css_fix
              continue-on-error: true
              run: |
                  stylelint "**/*.css" --fix

            - name: Auto-fix JavaScript
              id: js_fix
              continue-on-error: true
              run: |
                  eslint "**/*.js" --ignore-pattern eslint.config.js --fix

            - name: Lint HTML
              id: html_lint
              continue-on-error: true
              run: |
                  htmlhint "**/*.html"

            - name: Report lint results
              if: always()
              run: |
                  echo "Lint results:"
                  echo "  CSS:  ${{ steps.css_fix.outcome }}"
                  echo "  JS:   ${{ steps.js_fix.outcome }}"
                  echo "  HTML: ${{ steps.html_lint.outcome }}"

                  failed=0

                  if [ "${{ steps.css_fix.outcome }}" = "failure" ]; then
                      echo "CSS lint/fix failed"
                      failed=1
                  fi

                  if [ "${{ steps.js_fix.outcome }}" = "failure" ]; then
                      echo "JavaScript lint/fix failed"
                      failed=1
                  fi

                  if [ "${{ steps.html_lint.outcome }}" = "failure" ]; then
                      echo "HTML lint failed"
                      failed=1
                  fi

                  if [ "$failed" -ne 0 ]; then
                      echo "One or more lint checks failed."
                  fi

            - name: Check for changes
              id: changes
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create fix branch
              if: steps.changes.outputs.changed == 'true'
              run: |
                  branch_name="lint-fixes/${{ github.head_ref }}"
                  git checkout -b "$branch_name"

            - name: Commit changes
              if: steps.changes.outputs.changed == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -m "lint: auto-fix style issues"

            - name: Push fix branch
              if: steps.changes.outputs.changed == 'true'
              run: |
                  branch_name="lint-fixes/${{ github.head_ref }}"
                  git push --force-with-lease origin "$branch_name"

            - name: Create Pull Request for lint fixes
              if: steps.changes.outputs.changed == 'true'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  branch_name="lint-fixes/${{ github.head_ref }}"
                  gh pr create \
                    --base "${{ github.base_ref }}" \
                    --head "$branch_name" \
                    --title "Automated lint fixes for ${{ github.head_ref }}" \
                    --body "This PR was automatically created by GitHub Actions after running lint autofixes on the current PR branch.

                    Lint results:
                    - CSS: ${{ steps.css_fix.outcome }}
                    - JS: ${{ steps.js_fix.outcome }}
                    - HTML: ${{ steps.html_lint.outcome }}"