<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <img class="logo" src="static/logo.png">
        <div class="current-mod-id current-mod-hr">HR2</div>
        <div class="font-weight-600 current-round">// [CURRENT_BRACKET] SHOWCASE</div>

        <!-- Now Playing Area-->
        <div class="now-playing-section">
            <img class="now-playing-mask" src="https://assets.ppy.sh/beatmaps/1896584/covers/cover.jpg">
            <div class="font-weight-600 now-playing-metadata now-playing-artist">Tommy heavenly6</div>
            <div class="font-weight-600 now-playing-metadata now-playing-title">PAPERMOON</div>
            <div class="now-playing-line-three">
                <div class="now-playing-difficulty">Insane</div>
                <div class="font-weight-600 padding-y-2px now-playing-song-length">04:21</div>
                <div class="font-weight-600 color-949494 padding-y-2px now-playing-pipe">|</div>
                <div class="font-weight-600 color-949494 padding-y-2px now-playing-bpm"><span class="now-playing-bpm-number">164</span> BPM</div>
            </div>
            <div class="now-playing-stat-line now-playing-stat-line-sr">
                <div class="now-playing-box now-playing-box-sr">sr</div>
                <div class="now-playing-text">5.28*</div>
            </div>
            <div class="now-playing-stat-line now-playing-stat-line-cs">
                <div class="now-playing-box now-playing-box-cs">cs</div>
                <div class="now-playing-text">4.0</div>
            </div>
            <div class="now-playing-stat-line now-playing-stat-line-ar">
                <div class="now-playing-box now-playing-box-ar">ar</div>
                <div class="now-playing-text">8.0</div>
            </div>
            <div class="now-playing-stat-line now-playing-stat-line-od">
                <div class="now-playing-box now-playing-box-od">od</div>
                <div class="now-playing-text">8.0</div>
            </div>
            <div class="now-playing-bottom-metadata now-playing-mapped-by">mapped by <span class="font-weight-700">aishiteiru-</span></div>
            <div class="now-playing-bottom-metadata now-playing-replayed-by">replayed by <span class="font-weight-700">player-name</span></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
